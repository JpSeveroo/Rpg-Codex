[project]
name = "rpg-codex-dp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "inquirerpy>=0.3.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "PTH",
]
